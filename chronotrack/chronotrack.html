<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Connected ChronoTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f7fa; --bg2:#ffffff; --bg3:#eef1f6;
  --border:rgba(0,120,180,0.15);
  --blue:#0077b6; --blue-dim:rgba(0,119,182,0.08);
  --cyan:#0096c7; --red:#d62839; --red-dim:rgba(214,40,57,0.08);
  --yellow:#e07a00; --yellow-dim:rgba(224,122,0,0.08);
  --text:#1a2535; --muted:#7a8fa6; --faint:#c5d0de;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(0,119,182,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,119,182,0.03) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 1px 8px rgba(0,0,0,0.06)}
.logo-icon{width:34px;height:34px;background:var(--blue-dim);border:1px solid var(--blue);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.logo-text{flex:1}
.logo-text .sub{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.logo-text .main{font-family:'Rajdhani',sans-serif;font-size:19px;font-weight:700;letter-spacing:1px;color:var(--text);line-height:1}
.ble-badge{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1px solid;
  font-size:11px;font-weight:500;transition:all .3s;white-space:nowrap}
.ble-badge.connected{color:var(--blue);border-color:var(--blue);background:var(--blue-dim)}
.ble-badge.disconnected{color:var(--red);border-color:var(--red);background:var(--red-dim)}
.ble-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.ble-dot.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* VIEWS */
.view{display:none;flex-direction:column}
.view.active{display:flex}

/* SESSION LIST VIEW */
.view-header{padding:16px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.view-title{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:var(--text)}
.view-subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.btn-new{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;
  background:var(--blue);border:none;color:white;font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-new:active{opacity:0.8}

.sessions-list{padding:0 16px 100px;display:flex;flex-direction:column;gap:10px}
.session-card{background:var(--bg2);border:1px solid rgba(0,0,0,0.08);border-radius:14px;
  padding:14px 16px;cursor:pointer;transition:all .15s;box-shadow:0 1px 6px rgba(0,0,0,0.05);
  display:flex;align-items:center;gap:12px}
.session-card:active{transform:scale(0.98);background:var(--bg3)}
.session-icon{width:42px;height:42px;border-radius:11px;background:var(--blue-dim);
  border:1px solid rgba(0,119,182,0.2);display:flex;align-items:center;justify-content:center;
  font-size:19px;flex-shrink:0}
.session-info{flex:1;min-width:0}
.session-name{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.session-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;
  background:var(--blue-dim);color:var(--blue);font-size:10px;font-weight:600}
.session-arrow{color:var(--faint);font-size:20px;flex-shrink:0}

.empty-sessions{display:flex;flex-direction:column;align-items:center;padding:70px 20px;gap:10px}
.empty-sessions .icon{font-size:52px}
.empty-sessions p{font-size:15px;color:var(--muted);font-weight:500}
.empty-sessions small{font-size:12px;color:var(--faint);text-align:center}

/* CHRONO VIEW */
.chrono-topbar{padding:12px 16px;display:flex;align-items:center;gap:10px;
  background:var(--bg2);border-bottom:1px solid rgba(0,0,0,0.06);position:sticky;top:60px;z-index:90}
.back-btn{display:flex;align-items:center;gap:4px;padding:7px 11px;border-radius:9px;
  border:1px solid rgba(0,0,0,0.1);background:var(--bg3);color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;flex-shrink:0}
.back-btn:active{background:var(--faint)}
.session-hdr{flex:1;min-width:0}
.session-hdr-name{font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;
  color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-hdr-date{font-size:11px;color:var(--muted)}
.add-p-btn{width:36px;height:36px;border-radius:50%;background:var(--blue);border:none;
  color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;box-shadow:0 2px 10px rgba(0,119,182,0.3)}
.add-p-btn:active{opacity:0.8}

.sel-bar{margin:10px 16px 6px;display:flex;align-items:center;gap:6px}
.sel-count{font-size:12px;color:var(--muted);flex:1}
.sel-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;
  font-size:12px;cursor:pointer;transition:all .2s}
.sel-btn:active{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}

#participants-list{padding:0 16px;display:flex;flex-direction:column;gap:10px;padding-bottom:170px;min-height:100px}

/* PARTICIPANT CARD */
.p-card{background:var(--bg2);border:1px solid rgba(0,0,0,0.08);border-radius:14px;overflow:hidden;
  transition:border-color .2s,background .2s;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,0.05)}
.p-card.selected{background:#f0f7ff;border-color:var(--blue)}
.p-card.running{border-color:rgba(0,119,182,0.45)}
.p-card-main{padding:14px;display:flex;align-items:center;gap:12px}
.p-checkbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);
  background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.p-card.selected .p-checkbox{background:var(--blue);border-color:var(--blue)}
.p-checkbox svg{display:none;width:12px;height:12px}
.p-card.selected .p-checkbox svg{display:block}
.p-avatar{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--faint);background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;
  font-size:16px;font-weight:700;color:var(--muted);flex-shrink:0;transition:all .3s}
.p-card.running .p-avatar{border-color:var(--blue);background:var(--blue-dim);color:var(--blue)}
.p-info{flex:1;min-width:0}
.p-name{font-size:15px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-status{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px}
.p-status .dot{width:5px;height:5px;border-radius:50%;background:var(--blue);animation:pulse 1.2s infinite}
.p-time{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--muted);
  letter-spacing:1px;flex-shrink:0;transition:color .3s}
.p-card.running .p-time{color:var(--blue)}
.p-actions{border-top:1px solid rgba(0,0,0,0.05);padding:8px 14px;display:none;
  justify-content:space-between;background:var(--bg3)}
.p-card.show-actions .p-actions{display:flex}
.p-action-btn{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;
  background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px}
.p-action-btn.lap{color:var(--blue)}
.p-action-btn.reset{color:var(--muted)}
.p-laps{border-top:1px solid rgba(0,0,0,0.05);padding:8px 14px;background:var(--bg3);display:none}
.p-card.has-laps .p-laps{display:block}
.lap-row{display:flex;align-items:center;padding:3px 0;font-size:12px}
.lap-num{color:var(--muted);width:45px}
.lap-time{color:var(--cyan);font-family:'DM Mono',monospace;font-weight:500}
.lap-total{color:var(--faint);font-family:'DM Mono',monospace;font-size:11px;margin-left:auto}

.empty-p{display:flex;flex-direction:column;align-items:center;padding:50px 20px;gap:8px}
.empty-p .icon{font-size:40px}
.empty-p p{font-size:13px;color:var(--muted)}

/* IOT PANEL */
.iot-panel{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.97);
  backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,0.08);
  padding:12px 16px 30px;z-index:60;box-shadow:0 -4px 20px rgba(0,0,0,0.06)}
.iot-label{font-size:11px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.iot-btns{display:flex;gap:8px}
.iot-btn{flex:1;border:1.5px solid;border-radius:12px;background:transparent;cursor:pointer;
  padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:opacity .2s,transform .1s;font-family:'DM Sans',sans-serif}
.iot-btn:active{transform:scale(0.95)}
.iot-btn:disabled{opacity:0.25;cursor:not-allowed}
.iot-btn .bi{font-size:18px}
.iot-btn .bl{font-size:10px;font-weight:700;letter-spacing:0.8px}
.iot-btn.start{color:var(--blue);border-color:rgba(0,119,182,0.35);background:var(--blue-dim);flex:3}
.iot-btn.stop{color:var(--red);border-color:rgba(214,40,57,0.35);background:var(--red-dim);flex:3}
.iot-btn.lap{color:var(--yellow);border-color:rgba(224,122,0,0.35);background:var(--yellow-dim);flex:2}
.iot-btn.reset{color:var(--muted);border-color:rgba(0,0,0,0.1);background:var(--bg3);flex:2}

/* MODALS */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.3);
  backdrop-filter:blur(8px);display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{width:100%;background:var(--bg2);border-top:1px solid rgba(0,0,0,0.08);
  border-radius:20px 20px 0 0;padding:20px 20px 30px;transform:translateY(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,0.1);
  max-height:88vh;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal h3{font-family:'Rajdhani',sans-serif;font-size:19px;font-weight:700;color:var(--text);margin-bottom:16px}
.modal-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:0.5px}
.modal-section{margin-bottom:16px}
.modal-input{width:100%;background:var(--bg3);border:1px solid rgba(0,0,0,0.1);border-radius:10px;
  padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;
  outline:none;transition:border-color .2s}
.modal-input:focus{border-color:var(--blue)}
.modal-input::placeholder{color:var(--muted)}
.modal-btns{display:flex;gap:10px;margin-top:6px}
.modal-btn{flex:1;padding:13px;border-radius:11px;border:1px solid;font-family:'DM Sans',sans-serif;
  font-size:14px;font-weight:500;cursor:pointer;transition:opacity .2s}
.modal-btn:active{opacity:0.7}
.modal-btn.cancel{background:var(--bg3);border-color:rgba(0,0,0,0.1);color:var(--muted)}
.modal-btn.confirm{background:var(--blue);border-color:var(--blue);color:white}

/* PICKER */
.participants-picker{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;margin-bottom:8px}
.picker-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  border:1px solid rgba(0,0,0,0.08);background:var(--bg3);cursor:pointer;transition:all .15s}
.picker-item.sel{background:#f0f7ff;border-color:var(--blue)}
.picker-av{width:30px;height:30px;border-radius:50%;background:var(--blue-dim);
  border:1px solid rgba(0,119,182,0.2);display:flex;align-items:center;justify-content:center;
  font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;color:var(--blue);flex-shrink:0}
.picker-nm{flex:1;font-size:14px;font-weight:500;color:var(--text)}
.picker-ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--faint);
  background:transparent;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.picker-item.sel .picker-ck{background:var(--blue);border-color:var(--blue)}
.picker-ck svg{display:none;width:11px;height:11px}
.picker-item.sel .picker-ck svg{display:block}
.picker-empty{font-size:13px;color:var(--muted);text-align:center;padding:16px 0}
.picker-add-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.picker-add-row input{flex:1;background:var(--bg3);border:1px solid rgba(0,0,0,0.1);border-radius:8px;
  padding:9px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none}
.picker-add-row input:focus{border-color:var(--blue)}
.picker-add-row input::placeholder{color:var(--muted)}
.picker-add-btn{padding:9px 14px;border-radius:8px;background:var(--blue-dim);
  border:1px solid rgba(0,119,182,0.2);color:var(--blue);font-size:13px;font-weight:500;
  cursor:pointer;white-space:nowrap}
.picker-add-btn:active{background:rgba(0,119,182,0.18)}

/* TOAST */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--text);border-radius:10px;padding:10px 16px;font-size:13px;color:white;
  white-space:nowrap;opacity:0;transition:all .3s;z-index:300;pointer-events:none;
  box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="logo-icon">⏱</div>
  <div class="logo-text">
    <div class="sub">Connected</div>
    <div class="main">ChronoTrack</div>
  </div>
  <div class="ble-badge disconnected" id="ble-badge">
    <div class="ble-dot" id="ble-dot"></div>
    <span id="ble-label">Hors ligne</span>
  </div>
</header>

<!-- ══ VUE 1 : SESSIONS ══ -->
<div class="view active" id="view-sessions">
  <div class="view-header">
    <div>
      <div class="view-title">Mes sessions</div>
      <div class="view-subtitle" id="sessions-subtitle">Aucune session</div>
    </div>
    <button class="btn-new" onclick="openNewSessionModal()">+ Nouvelle</button>
  </div>
  <div class="sessions-list" id="sessions-list">
    <div class="empty-sessions" id="empty-sessions">
      <div class="icon">📋</div>
      <p>Aucune session</p>
      <small>Crée ta première session pour commencer à chronométrer</small>
    </div>
  </div>
</div>

<!-- ══ VUE 2 : CHRONO ══ -->
<div class="view" id="view-chrono">
  <div class="chrono-topbar">
    <button class="back-btn" onclick="goBack()">← Sessions</button>
    <div class="session-hdr">
      <div class="session-hdr-name" id="chrono-name">—</div>
      <div class="session-hdr-date" id="chrono-date">—</div>
    </div>
    <button class="add-p-btn" onclick="openAddModal()" title="Ajouter un participant">+</button>
  </div>
  <div class="sel-bar">
    <span class="sel-count" id="sel-count">0 sélectionné(s)</span>
    <button class="sel-btn" onclick="selectAll()">Tous</button>
    <button class="sel-btn" onclick="deselectAll()">Aucun</button>
  </div>
  <div id="participants-list"></div>
  <div class="iot-panel">
    <div class="iot-label">🔵 <span id="iot-label-text">Boîtier IoT non connecté — contrôle manuel</span></div>
    <div class="iot-btns">
      <button class="iot-btn start" id="btn-start" onclick="startSelected()" disabled>
        <span class="bi">▶</span><span class="bl">START</span>
      </button>
      <button class="iot-btn stop" id="btn-stop" onclick="stopSelected()" disabled>
        <span class="bi">⏹</span><span class="bl">STOP</span>
      </button>
      <button class="iot-btn lap" id="btn-lap" onclick="lapAll()" disabled>
        <span class="bi">🚩</span><span class="bl">LAP</span>
      </button>
      <button class="iot-btn reset" onclick="resetAll()">
        <span class="bi">↺</span><span class="bl">RESET</span>
      </button>
    </div>
  </div>
</div>

<!-- ══ MODAL : NOUVELLE SESSION ══ -->
<div class="modal-overlay" id="modal-new-session">
  <div class="modal">
    <h3>Nouvelle session</h3>
    <div class="modal-section">
      <label class="modal-label">Nom de la session</label>
      <input class="modal-input" id="ns-name" type="text" placeholder="Ex : Entraînement lundi matin">
    </div>
    <div class="modal-section">
      <label class="modal-label">Date</label>
      <input class="modal-input" id="ns-date" type="date">
    </div>
    <div class="modal-section">
      <label class="modal-label">Participants</label>
      <div class="participants-picker" id="ns-picker"></div>
      <div class="picker-add-row">
        <input type="text" id="ns-new-p" placeholder="Nouveau participant...">
        <button class="picker-add-btn" onclick="nsAddNewP()">+ Créer</button>
      </div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal('modal-new-session')">Annuler</button>
      <button class="modal-btn confirm" onclick="createSession()">Créer ›</button>
    </div>
  </div>
</div>

<!-- ══ MODAL : AJOUTER PARTICIPANT ══ -->
<div class="modal-overlay" id="modal-add-p">
  <div class="modal">
    <h3>Ajouter un participant</h3>
    <div class="modal-section">
      <label class="modal-label">Participants existants</label>
      <div class="participants-picker" id="ap-picker"></div>
    </div>
    <div class="modal-section">
      <label class="modal-label">Ou créer un nouveau</label>
      <input class="modal-input" id="ap-new-name" type="text" placeholder="Nom du participant">
    </div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal('modal-add-p')">Annuler</button>
      <button class="modal-btn confirm" onclick="confirmAddP()">Ajouter ›</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDocs, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyASeqLubTgHZxmzvCkNg7nwTFIZOh4sMCA",
  authDomain:        "chronotrack-8c563.firebaseapp.com",
  projectId:         "chronotrack-8c563",
  storageBucket:     "chronotrack-8c563.firebasestorage.app",
  messagingSenderId: "515465540862",
  appId:             "1:515465540862:web:1723c4fc0f87e04e87e1af",
  measurementId:     "G-9ZPXNQWL2J"
};

let db = null;
try {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  document.getElementById('ble-badge').className = 'ble-badge connected';
  document.getElementById('ble-dot').classList.add('pulse');
  document.getElementById('ble-label').textContent = 'Firebase OK';
  document.getElementById('iot-label-text').textContent = 'Synchronisation Firebase active';
} catch(e) { console.warn('Firebase non dispo'); }

window._db = db;

window.fbSaveSession = async (s) => {
  if (!db) return;
  await setDoc(doc(db,'sessions',s.id),{name:s.name,date:s.date,createdAt:serverTimestamp()},{merge:true});
};
window.fbSaveGlobalP = async (p) => {
  if (!db) return;
  await setDoc(doc(db,'participants',p.id),{name:p.name},{merge:true});
};
window.fbSaveSessP = async (sid,p) => {
  if (!db) return;
  await setDoc(doc(db,'sessions',sid,'participants',p.id),
    {name:p.name,elapsed:p.elapsed,isRunning:false,startTime:null,laps:p.laps,updatedAt:serverTimestamp()},
    {merge:true});
};

// Chargement initial
(async () => {
  if (!db) return;
  try {
    const pSnap = await getDocs(collection(db,'participants'));
    pSnap.forEach(d => {
      if (!window._globalP.find(p=>p.id===d.id))
        window._globalP.push({id:d.id,name:d.data().name});
    });
    const sSnap = await getDocs(collection(db,'sessions'));
    for (const sd of sSnap.docs) {
      if (window._sessions.find(s=>s.id===sd.id)) continue;
      const sess={id:sd.id,name:sd.data().name,date:sd.data().date,participants:[]};
      const ppSnap = await getDocs(collection(db,'sessions',sd.id,'participants'));
      ppSnap.forEach(pd=>{
        sess.participants.push({id:pd.id,name:pd.data().name,elapsed:pd.data().elapsed||0,
          isRunning:false,startTime:null,laps:pd.data().laps||[],isSelected:false});
      });
      window._sessions.push(sess);
    }
    // Trier par date décroissante
    window._sessions.sort((a,b)=>b.date.localeCompare(a.date));
    renderSessions();
  } catch(e){ console.warn('Erreur chargement Firebase',e); }
})();
</script>

<!-- APP LOGIC -->
<script>
window._globalP   = [];
window._sessions  = [];
window._curSess   = null;
window._ticker    = null;
window._pickerSel = new Set();

// ── NAVIGATION ─────────────────────────────────────────────────
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goBack(){
  stopTicker();
  window._curSess = null;
  showView('view-sessions');
  renderSessions();
}

function openSession(sid){
  const s = window._sessions.find(x=>x.id===sid);
  if(!s) return;
  window._curSess = s;
  document.getElementById('chrono-name').textContent = s.name;
  document.getElementById('chrono-date').textContent = '📅 ' + formatDate(s.date);
  showView('view-chrono');
  renderAll();
}

// ── DATE ───────────────────────────────────────────────────────
function todayISO(){ return new Date().toISOString().split('T')[0]; }

function formatDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const mo = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  return `${parseInt(d)} ${mo[parseInt(m)-1]} ${y}`;
}

// ── SESSIONS ───────────────────────────────────────────────────
function openNewSessionModal(){
  document.getElementById('ns-name').value = '';
  document.getElementById('ns-date').value = todayISO();
  document.getElementById('ns-new-p').value = '';
  window._pickerSel = new Set();
  renderPicker('ns-picker', window._globalP, window._pickerSel, toggleNsPicker);
  openModal('modal-new-session');
  setTimeout(()=>document.getElementById('ns-name').focus(),300);
}

function nsAddNewP(){
  const input = document.getElementById('ns-new-p');
  const name  = input.value.trim();
  if(!name) return;
  const id = Date.now().toString();
  window._globalP.push({id,name});
  window._pickerSel.add(id);
  fbSaveGlobalP({id,name});
  input.value='';
  renderPicker('ns-picker', window._globalP, window._pickerSel, toggleNsPicker);
  showToast(`${name} créé ✓`);
}

function toggleNsPicker(id){
  if(window._pickerSel.has(id)) window._pickerSel.delete(id);
  else window._pickerSel.add(id);
  renderPicker('ns-picker', window._globalP, window._pickerSel, toggleNsPicker);
}

function createSession(){
  const name = document.getElementById('ns-name').value.trim();
  const date = document.getElementById('ns-date').value || todayISO();
  if(!name){ showToast('Entre un nom de session'); return; }

  const s = {id:Date.now().toString(), name, date, participants:[]};
  window._pickerSel.forEach(pid=>{
    const gp = window._globalP.find(p=>p.id===pid);
    if(gp) s.participants.push({id:gp.id,name:gp.name,elapsed:0,isRunning:false,startTime:null,laps:[],isSelected:false});
  });

  window._sessions.unshift(s);
  fbSaveSession(s);
  s.participants.forEach(p=>fbSaveSessP(s.id,p));

  closeModal('modal-new-session');
  showToast(`"${name}" créée ✓`);
  renderSessions();
  openSession(s.id);
}

function renderSessions(){
  const list  = document.getElementById('sessions-list');
  const empty = document.getElementById('empty-sessions');
  const sub   = document.getElementById('sessions-subtitle');
  const ss    = window._sessions;

  sub.textContent = ss.length===0 ? 'Aucune session' : `${ss.length} session(s)`;

  if(ss.length===0){
    list.innerHTML='';
    list.appendChild(empty);
    empty.style.display='flex';
    return;
  }
  empty.style.display='none';
  list.innerHTML = ss.map(s=>`
    <div class="session-card" onclick="openSession('${s.id}')">
      <div class="session-icon">🏃</div>
      <div class="session-info">
        <div class="session-name">${s.name}</div>
        <div class="session-meta">
          📅 ${formatDate(s.date)}
          <span class="session-badge">👥 ${s.participants.length} participant(s)</span>
        </div>
      </div>
      <div class="session-arrow">›</div>
    </div>`).join('');
}

// ── ADD PARTICIPANT TO SESSION ─────────────────────────────────
function openAddModal(){
  window._pickerSel = new Set();
  const existing = new Set(window._curSess.participants.map(p=>p.id));
  const avail    = window._globalP.filter(p=>!existing.has(p.id));
  renderPicker('ap-picker', avail, window._pickerSel, toggleApPicker);
  document.getElementById('ap-new-name').value='';
  openModal('modal-add-p');
}

function toggleApPicker(id){
  if(window._pickerSel.has(id)) window._pickerSel.delete(id);
  else window._pickerSel.add(id);
  const existing = new Set(window._curSess.participants.map(p=>p.id));
  const avail    = window._globalP.filter(p=>!existing.has(p.id));
  renderPicker('ap-picker', avail, window._pickerSel, toggleApPicker);
}

function confirmAddP(){
  let added=0;
  window._pickerSel.forEach(pid=>{
    const gp = window._globalP.find(p=>p.id===pid);
    if(gp && !window._curSess.participants.find(p=>p.id===pid)){
      const np={id:gp.id,name:gp.name,elapsed:0,isRunning:false,startTime:null,laps:[],isSelected:false};
      window._curSess.participants.push(np);
      fbSaveSessP(window._curSess.id,np);
      added++;
    }
  });
  const newName = document.getElementById('ap-new-name').value.trim();
  if(newName){
    const np={id:Date.now().toString(),name:newName,elapsed:0,isRunning:false,startTime:null,laps:[],isSelected:false};
    window._curSess.participants.push(np);
    window._globalP.push({id:np.id,name:np.name});
    fbSaveGlobalP({id:np.id,name:np.name});
    fbSaveSessP(window._curSess.id,np);
    added++;
  }
  closeModal('modal-add-p');
  renderAll();
  if(added) showToast(`${added} participant(s) ajouté(s) ✓`);
}

// ── PICKER RENDER ──────────────────────────────────────────────
function renderPicker(containerId, list, selSet, toggleFn){
  const el = document.getElementById(containerId);
  if(list.length===0){
    el.innerHTML='<div class="picker-empty">Aucun participant disponible</div>';
    return;
  }
  el.innerHTML = list.map(p=>`
    <div class="picker-item ${selSet.has(p.id)?'sel':''}" onclick="${toggleFn.name}('${p.id}')">
      <div class="picker-av">${p.name[0].toUpperCase()}</div>
      <div class="picker-nm">${p.name}</div>
      <div class="picker-ck">
        <svg viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2"><polyline points="2,6 5,9 10,3"/></svg>
      </div>
    </div>`).join('');
}

// ── CHRONO LOGIC ───────────────────────────────────────────────
function ps(){ return window._curSess ? window._curSess.participants : []; }
function now(){ return Date.now(); }
function ct(p){ return p.isRunning&&p.startTime ? p.elapsed+(now()-p.startTime) : p.elapsed; }

function fms(ms){
  if(ms<0)ms=0;
  const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), c=Math.floor((ms%1000)/10);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(c).padStart(2,'0')}`;
}

function startSelected(){
  const t=now(); let n=0;
  ps().forEach(p=>{ if(p.isSelected&&!p.isRunning){p.isRunning=true;p.startTime=t;fbSaveSessP(window._curSess.id,p);n++;} });
  startTicker(); renderAll(); if(n) showToast(`${n} chrono(s) démarré(s) ▶`);
}
function stopSelected(){
  let n=0;
  ps().forEach(p=>{ if(p.isSelected&&p.isRunning){p.elapsed=ct(p);p.isRunning=false;p.startTime=null;fbSaveSessP(window._curSess.id,p);n++;} });
  checkTicker(); renderAll(); if(n) showToast(`${n} chrono(s) arrêté(s) ⏹`);
}
function lapAll(){
  let n=0;
  ps().forEach(p=>{ if(p.isRunning){ const tot=ct(p),prev=p.laps.length?p.laps[p.laps.length-1].total:0; p.laps.push({lap:tot-prev,total:tot}); fbSaveSessP(window._curSess.id,p); n++; } });
  renderAll(); if(n) showToast(`Lap pour ${n} participant(s) 🚩`);
}
function lapOne(id){
  const p=ps().find(p=>p.id===id); if(!p||!p.isRunning) return;
  const tot=ct(p),prev=p.laps.length?p.laps[p.laps.length-1].total:0;
  p.laps.push({lap:tot-prev,total:tot}); fbSaveSessP(window._curSess.id,p);
  renderAll(); showToast(`Lap — ${p.name} 🚩`);
}
function resetOne(id){
  const p=ps().find(p=>p.id===id); if(!p) return;
  p.elapsed=0;p.isRunning=false;p.startTime=null;p.laps=[];
  fbSaveSessP(window._curSess.id,p); checkTicker(); renderAll();
}
function resetAll(){
  ps().forEach(p=>{p.elapsed=0;p.isRunning=false;p.startTime=null;p.laps=[];fbSaveSessP(window._curSess.id,p);});
  stopTicker(); renderAll(); showToast('Tout réinitialisé ↺');
}
function toggleSelect(id){ const p=ps().find(p=>p.id===id); if(p){p.isSelected=!p.isSelected;renderAll();} }
function selectAll()  { ps().forEach(p=>p.isSelected=true);  renderAll(); }
function deselectAll(){ ps().forEach(p=>p.isSelected=false); renderAll(); }

function startTicker(){
  if(window._ticker) return;
  window._ticker=setInterval(()=>{
    document.querySelectorAll('.p-card.running .p-time').forEach(el=>{
      const id=el.closest('.p-card').dataset.id;
      const p=ps().find(p=>p.id===id);
      if(p) el.textContent=fms(ct(p));
    });
  },33);
}
function stopTicker(){ clearInterval(window._ticker); window._ticker=null; }
function checkTicker(){ if(!ps().some(p=>p.isRunning)) stopTicker(); }

function renderAll(){
  const list=document.getElementById('participants-list');
  const all=ps(), sel=all.filter(p=>p.isSelected).length, run=all.filter(p=>p.isRunning).length;
  document.getElementById('sel-count').textContent=`${sel}/${all.length} sélectionné(s)`;
  document.getElementById('btn-start').disabled=!(sel>0&&all.some(p=>p.isSelected&&!p.isRunning));
  document.getElementById('btn-stop').disabled =!(sel>0&&all.some(p=>p.isSelected&&p.isRunning));
  document.getElementById('btn-lap').disabled  =run===0;
  if(all.length===0){
    list.innerHTML=`<div class="empty-p"><div class="icon">👥</div><p>Appuie sur + pour ajouter des participants</p></div>`;
    return;
  }
  list.innerHTML=all.map(p=>{
    const t=fms(ct(p)), ini=p.name[0].toUpperCase(), hl=p.laps.length>0, sa=p.isRunning||p.elapsed>0;
    let cl='p-card';
    if(p.isSelected)cl+=' selected'; if(p.isRunning)cl+=' running';
    if(sa)cl+=' show-actions'; if(hl)cl+=' has-laps';
    const status=p.isRunning
      ?`<div class="p-status"><div class="dot"></div> En cours</div>`
      :hl?`<div class="p-status">${p.laps.length} lap(s)</div>`
      :`<div class="p-status">En attente</div>`;
    const laps=hl?p.laps.map((l,i)=>`
      <div class="lap-row">
        <span class="lap-num">Lap ${i+1}</span>
        <span class="lap-time">${fms(l.lap)}</span>
        <span class="lap-total">Total ${fms(l.total)}</span>
      </div>`).join(''):'';
    return `
    <div class="${cl}" data-id="${p.id}" onclick="toggleSelect('${p.id}')">
      <div class="p-card-main">
        <div class="p-checkbox"><svg viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2"><polyline points="2,6 5,9 10,3"/></svg></div>
        <div class="p-avatar">${ini}</div>
        <div class="p-info"><div class="p-name">${p.name}</div>${status}</div>
        <div class="p-time">${t}</div>
      </div>
      ${sa?`<div class="p-actions">
        ${p.isRunning?`<button class="p-action-btn lap" onclick="event.stopPropagation();lapOne('${p.id}')">🚩 Lap</button>`:'<span></span>'}
        <button class="p-action-btn reset" onclick="event.stopPropagation();resetOne('${p.id}')">↺ Reset</button>
      </div>`:''}
      ${hl?`<div class="p-laps">${laps}</div>`:''}
    </div>`;
  }).join('');
  if(!window._ticker&&all.some(p=>p.isRunning)) startTicker();
}

// ── MODAL & TOAST ──────────────────────────────────────────────
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('open'); });
});
document.getElementById('ns-name').addEventListener('keydown',e=>{ if(e.key==='Enter') createSession(); });

let _tt=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2200);
}

renderSessions();
</script>
</body>
